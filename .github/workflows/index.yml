# Publishes a flat package index of the wheels on every release of the
# repositories below to GitHub Pages. Other projects install from it with
#   uv:  [[tool.uv.index]] url = "https://qinbeans.github.io/mlir-python/", format = "flat"
#   pip: pip install mlir-python --find-links https://qinbeans.github.io/mlir-python/
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Package index

on:
  # Runs after wheels.yml attaches wheels to a release, and whenever a release
  # here is changed by hand.
  workflow_call:
  release:
    types: [published, edited, deleted]
  # Picks up the other repositories' releases, which cannot trigger this
  # workflow without a token (send a `releases-changed` repository_dispatch
  # with one for an immediate update).
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [releases-changed]
  workflow_dispatch:

env:
  REPOSITORIES: >-
    Qinbeans/mlir-python
    Qinbeans/tree-sitter-bifrost

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: List every release's wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          for repository in $REPOSITORIES; do
            gh api --paginate --slurp "repos/$repository/releases"
          done | python3 tools/flat_index.py > site/index.html
          cat site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
